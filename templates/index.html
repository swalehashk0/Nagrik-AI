<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nagrik-AI | Smart Public Grievance System</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: linear-gradient(135deg, #14213d, #1d4ed8);
    color: white;
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #60a5fa;
}

nav button {
    background: transparent;
    border: none;
    color: white;
    margin-left: 18px;
    cursor: pointer;
    font-size: 14px;
}

.container {
    width: 86%;
    max-width: 1200px;
    margin: 30px auto;
}

.hero {
    background: white;
    padding: 32px;
    border-radius: 16px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.hero h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.hero p {
    color: #64748b;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 22px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.card h2 {
    margin-bottom: 20px;
}

label {
    display: block;
    margin: 13px 0 6px;
    font-weight: bold;
}

input, textarea, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #d6dce5;
    border-radius: 9px;
    font-size: 14px;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

.primary {
    margin-top: 18px;
    background: #2563eb;
    color: white;
    border: none;
    padding: 13px 22px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
}

.primary:hover {
    background: #1d4ed8;
}

.result {
    margin-top: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 13px;
    box-shadow: 0 4px 15px rgba(0,0,0,.05);
}

.stat small {
    color: #64748b;
}

.stat strong {
    display: block;
    font-size: 28px;
    margin-top: 8px;
}

.ai-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 18px;
}

.info {
    background: #f8fafc;
    padding: 14px;
    border-radius: 9px;
}

.info b {
    display: block;
    color: #64748b;
    font-size: 12px;
    margin-bottom: 5px;
}

.badge {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    background: #dbeafe;
    color: #1d4ed8;
    font-weight: bold;
    font-size: 12px;
}

.priority {
    background: #fee2e2;
    color: #b91c1c;
}

.status {
    background: #dcfce7;
    color: #166534;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
    font-size: 13px;
}

th {
    background: #f8fafc;
}

.message {
    margin-top: 15px;
    padding: 13px;
    border-radius: 8px;
    background: #eff6ff;
    color: #1d4ed8;
}

.history {
    margin-top: 20px;
    border-left: 3px solid #2563eb;
    padding-left: 15px;
}

.history-item {
    margin-bottom: 15px;
}

@media(max-width: 800px) {
    .grid, .ai-grid {
        grid-template-columns: 1fr 1fr;
    }

    nav button {
        margin-left: 5px;
    }
}

@media(max-width: 550px) {
    .grid, .ai-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Nagrik<span>-AI</span></div>

    <nav>
        <button onclick="showSection('submit')">Submit</button>
        <button onclick="showSection('track')">Track</button>
        <button onclick="showSection('officer')">Officer</button>
        <button onclick="showSection('analytics')">Analytics</button>
    </nav>
</header>

<div class="container">

    <div class="hero">
        <h1>Smart Public Grievance Resolution</h1>
        <p>AI-powered complaint classification, routing and tracking.</p>
    </div>

    <!-- SUBMIT -->
    <section id="submit" class="section active">

        <div class="card">
            <h2>Submit a Complaint</h2>

            <form id="complaintForm">

                <label>Your Name</label>
                <input id="name" required placeholder="Enter your name">

                <label>Email</label>
                <input id="email" type="email" placeholder="Enter your email">

                <label>Complaint</label>
                <textarea id="complaint" required
                    placeholder="Describe your public issue..."></textarea>

                <button class="primary" type="submit">
                    Submit Complaint
                </button>

            </form>

            <div id="submitResult"></div>
        </div>

    </section>

    <!-- TRACK -->
    <section id="track" class="section">

        <div class="card">
            <h2>Track Complaint</h2>

            <label>Complaint ID</label>

            <input id="trackId" type="number"
                   placeholder="Example: 1">

            <button class="primary" onclick="trackComplaint()">
                Track Complaint
            </button>

            <div id="trackResult"></div>
        </div>

    </section>

    <!-- OFFICER -->
    <section id="officer" class="section">

        <div class="card">
            <h2>Officer Dashboard</h2>

            <div id="complaintsTable">
                Loading complaints...
            </div>
        </div>

    </section>

    <!-- ANALYTICS -->
    <section id="analytics" class="section">

        <div class="card">
            <h2>Complaint Analytics</h2>

            <div class="grid" id="stats"></div>

            <br>

            <h3>Categories</h3>
            <div id="categories"></div>

        </div>

    </section>

</div>

<script>

function showSection(id) {

    document.querySelectorAll(".section")
        .forEach(s => s.classList.remove("active"));

    document.getElementById(id)
        .classList.add("active");

    if (id === "officer") {
        loadComplaints();
    }

    if (id === "analytics") {
        loadAnalytics();
    }
}


/* SUBMIT COMPLAINT */

document.getElementById("complaintForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const resultBox =
        document.getElementById("submitResult");

    resultBox.innerHTML =
        "<div class='message'>AI is analyzing your complaint...</div>";

    const body = {

        citizen_name:
            document.getElementById("name").value,

        citizen_email:
            document.getElementById("email").value,

        complaint_text:
            document.getElementById("complaint").value
    };

    try {

        const response = await fetch("/complaints", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(body)
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Submission failed");
        }

        resultBox.innerHTML = `

        <div class="card result">

            <h2>Complaint Submitted ✓</h2>

            <p>Complaint ID:
                <strong>#${data.complaint_id}</strong>
            </p>

            <div class="ai-grid">

                <div class="info">
                    <b>CATEGORY</b>
                    ${data.category}
                </div>

                <div class="info">
                    <b>PRIORITY</b>
                    <span class="badge priority">
                        ${data.priority}
                    </span>
                </div>

                <div class="info">
                    <b>DEPARTMENT</b>
                    ${data.department}
                </div>

                <div class="info">
                    <b>LOCATION</b>
                    ${data.location}
                </div>

                <div class="info">
                    <b>AI CONFIDENCE</b>
                    ${(data.confidence * 100).toFixed(0)}%
                </div>

                <div class="info">
                    <b>STATUS</b>
                    <span class="badge status">
                        ${data.status}
                    </span>
                </div>

            </div>

            <div class="info" style="margin-top:12px">
                <b>AI SUMMARY</b>
                ${data.summary}
            </div>

            <div class="info" style="margin-top:12px">
                <b>URGENCY REASON</b>
                ${data.urgency_reason}
            </div>

            <div class="info" style="margin-top:12px">
                <b>SUGGESTED ACTION</b>
                ${data.suggested_action}
            </div>

        </div>
        `;

    } catch(error) {

        resultBox.innerHTML =
            `<div class="message">${error.message}</div>`;
    }

});


/* TRACK */

async function trackComplaint() {

    const id =
        document.getElementById("trackId").value;

    const box =
        document.getElementById("trackResult");

    if (!id) {
        box.innerHTML =
            "<div class='message'>Enter a complaint ID.</div>";
        return;
    }

    try {

        const response =
            await fetch(`/complaints/${id}`);

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(data.error);
        }

        const historyResponse =
            await fetch(`/complaints/${id}/history`);

        const history =
            await historyResponse.json();

        box.innerHTML = `

        <div class="card result">

            <h2>Complaint #${data.id}</h2>

            <div class="ai-grid">

                <div class="info">
                    <b>CATEGORY</b>
                    ${data.category}
                </div>

                <div class="info">
                    <b>PRIORITY</b>
                    <span class="badge priority">
                        ${data.priority}
                    </span>
                </div>

                <div class="info">
                    <b>DEPARTMENT</b>
                    ${data.department}
                </div>

                <div class="info">
                    <b>STATUS</b>
                    <span class="badge status">
                        ${data.status}
                    </span>
                </div>

            </div>

            <div class="info" style="margin-top:12px">
                <b>COMPLAINT</b>
                ${data.complaint_text}
            </div>

            <div class="history">

                <h3>Status History</h3>

                ${
                    history.length
                    ?
                    history.map(h => `
                        <div class="history-item">
                            <strong>${h.status}</strong>
                            <br>
                            <small>${h.updated_at}</small>
                            <br>
                            ${h.note || ""}
                        </div>
                    `).join("")
                    :
                    "<p>No status updates yet.</p>"
                }

            </div>

        </div>

        `;

    } catch(error) {

        box.innerHTML =
            `<div class="message">${error.message}</div>`;
    }
}


/* OFFICER DASHBOARD */

async function loadComplaints() {

    const box =
        document.getElementById("complaintsTable");

    try {

        const response =
            await fetch("/complaints");

        const complaints =
            await response.json();

        if (!complaints.length) {

            box.innerHTML =
                "<p>No complaints found.</p>";

            return;
        }

        box.innerHTML = `

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Category</th>
                    <th>Priority</th>
                    <th>Department</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody>

                ${complaints.map(c => `

                    <tr>

                        <td>#${c.id}</td>

                        <td>${c.category}</td>

                        <td>
                            <span class="badge priority">
                                ${c.priority}
                            </span>
                        </td>

                        <td>${c.department}</td>

                        <td>${c.status}</td>

                        <td>

                            <select
                                onchange="updateStatus(${c.id}, this.value)"
                            >

                                <option
                                    ${c.status === "Pending" ? "selected" : ""}
                                >
                                    Pending
                                </option>

                                <option
                                    ${c.status === "Assigned" ? "selected" : ""}
                                >
                                    Assigned
                                </option>

                                <option
                                    ${c.status === "In Progress" ? "selected" : ""}
                                >
                                    In Progress
                                </option>

                                <option
                                    ${c.status === "Resolved" ? "selected" : ""}
                                >
                                    Resolved
                                </option>

                            </select>

                        </td>

                    </tr>

                `).join("")}

            </tbody>

        </table>
        `;

    } catch(error) {

        box.innerHTML =
            `<div class="message">${error.message}</div>`;
    }
}


async function updateStatus(id, status) {

    try {

        const response =
            await fetch(`/complaints/${id}/status`, {

                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: status
                })
            });

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(data.error);
        }

        loadComplaints();

    } catch(error) {

        alert(error.message);
    }
}


/* ANALYTICS */

async function loadAnalytics() {

    try {

        const response =
            await fetch("/analytics");

        const data =
            await response.json();

        const status =
            data.status_counts || {};

        document.getElementById("stats").innerHTML = `

            <div class="stat">
                <small>Total Complaints</small>
                <strong>${data.total_complaints}</strong>
            </div>

            <div class="stat">
                <small>Pending</small>
                <strong>${status.Pending || 0}</strong>
            </div>

            <div class="stat">
                <small>In Progress</small>
                <strong>${status["In Progress"] || 0}</strong>
            </div>

            <div class="stat">
                <small>Resolved</small>
                <strong>${status.Resolved || 0}</strong>
            </div>

        `;

        const categories =
            data.category_counts || {};

        document.getElementById("categories").innerHTML =

            Object.entries(categories)
            .map(([name, count]) => `

                <div class="info" style="margin-top:8px">
                    <b>${name}</b>
                    ${count} complaint(s)
                </div>

            `)
            .join("");

    } catch(error) {

        document.getElementById("stats").innerHTML =
            `<div class="message">${error.message}</div>`;
    }
}

</script>

</body>
</html>
